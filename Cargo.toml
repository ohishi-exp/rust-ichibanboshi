[package]
name = "rust-ichibanboshi"
version = "0.1.0"
edition = "2021"
description = "一番星 SQL Server sales data API — Windows Service with Cloudflare Tunnel"

[[bin]]
name = "ichibanboshi"
path = "src/main.rs"

# RDP 中継 (ブラウザ ↔ RDS)。ohishi-data 上で ichibanboshi と並べて動かす。
# 詳細は docs/plan-ironrdp-rail.md。
[[bin]]
name = "rdp-relay"
path = "src/bin/rdp_relay.rs"

[lib]
name = "rust_ichibanboshi"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
# 担当者振替の備考2 パース (PHP preg_match /(.+)→(.+)/u 写経用、routes/uriage.rs)
regex = "1"
# Phase 2 担当者別売上 summary local store (sqlite.rs)。bundled で OS の libsqlite 不要
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 2 CakePHP masters / editable-months HTTP pull (社内 LAN、token 不要)
# rustls-tls で openssl 依存を回避 (musl static build を維持)
# multipart: csvdata.zip を POST /dtako-events/autoload へ multipart/form-data で
# 中継するため (Refs #205 の 58 / #274)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
# Phase 2 raw NDJSON.gz 出力
flate2 = "1"
# Phase 2 fingerprint (raw rows sha256 — recalc skip 判定 + R2 sync 必要性判定)
sha2 = "0.10"
mysql_async = { version = "0.37.0", default-features = false, features = ["minimal-rust"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }

# RDP 中継用。ironrdp は RDP の PDU 定義をそのまま借りる (自前で組み立て直さない)。
# rustls は既定の aws-lc-rs ではなく ring を明示する — musl static build を維持するため
# (既存の reqwest / sqlx / tiberius も rustls-tls で openssl を避けている)。
ironrdp-core = "0.2"
ironrdp-pdu = "0.9"
ironrdp-rdcleanpath = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[build-dependencies]
# build.rs の KINTAI_OUTPUT_SHA (出力に効くコードの内容ハッシュ、Refs #191)
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# CakePHP fetch を stub する HTTP mock (Phase 2 /recalc 統合テスト)
wiremock = "0.6"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = 2
lto = true
strip = true
