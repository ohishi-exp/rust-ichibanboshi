[package]
name = "rust-ichibanboshi"
version = "0.1.0"
edition = "2021"
description = "RDP relay (browser ↔ RDS, RDCleanPath) — Linux service behind Cloudflare Access"

# RDP 中継 (ブラウザ ↔ RDS)。この package が持つ唯一の binary。
# 売上・勤怠・一番星の読みは Worker (workers/) へ移った (Refs #322)。詳細は docs/plan-ironrdp-rail.md。
[[bin]]
name = "rdp-relay"
path = "src/bin/rdp_relay.rs"

[lib]
name = "rust_ichibanboshi"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
# env: rdp-relay の Access 設定 (team ドメイン / AUD) を systemd の EnvironmentFile から
# 受けるため。site 固有の値を unit ファイルにも repo にも置かずに済む
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# cf_access.rs が Access の JWKS を取りに行く。rustls-tls で openssl 依存を回避 (musl static build を維持)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# RDP 中継用。ironrdp は RDP の PDU 定義をそのまま借りる (自前で組み立て直さない)。
# rustls は既定の aws-lc-rs ではなく ring を明示する — musl static build を維持するため
# (reqwest も rustls-tls で openssl を避けている)。
ironrdp-core = "0.2"
ironrdp-pdu = "0.9"
ironrdp-rdcleanpath = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# 中継の入口で Cloudflare Access の JWT (Cf-Access-Jwt-Assertion) を検証する (cf_access.rs)。
# ring 実装なので openssl を引き込まない。先例は rust-alc-api の
# crates/alc-core/src/auth_google.rs (Google OIDC を同じ形で検証、100% 登録済み)
jsonwebtoken = "9"

[dev-dependencies]
# cf_access のテストで JWKS の取得を stub する HTTP mock
wiremock = "0.6"
# cf_access / rdp_defaults のテストで JSON を組み立てる・読む
serde_json = "1"
# cf_access のテストでトークンの exp を作る
chrono = "0.4"
# cf_access のテストで RSA 鍵を起こし、JWKS (n, e) と署名済みトークンを自作するため。
# 本体は検証しかしないので dev 限定 (先例: rust-alc-api crates/alc-core)
rsa = "0.9"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = 2
# fat LTO は依存 cache があっても毎回 2 分半かかるため thin (Refs #322)
lto = "thin"
strip = true
