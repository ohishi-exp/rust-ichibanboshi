# ichibanboshi-kintai: 勤怠 (kintai) の読み出し Worker (Refs ohishi-exp/rust-ichibanboshi#322)。
# Service Binding 専用。口は到達の確認用の POST /probe (社内 MariaDB、自作の MySQL クライアント kintai-mysql) と、
# Supabase の勤怠スキーマを読む GET /api/kintai/* の 7 本 (unko-gaps は auth-worker の RPC で alc の etags も読む)・書く POST の 2 本 (Hyperdrive + alc-worker-db)、
# 社内 MariaDB を直接読む GET の 10 本 (events・rest-diff・reading-dates・tail-gap-probe・day-events・dtako/worktime・
# kosoku-daily・version・timecard/drivers・timecard/events)、社内 CakePHP (Workers VPC の HTTP) を中継する GET の 2 本
# (daily・pdf-json) と POST /api/dtako/autoload (書き込みの口)、拘束サマリの PUT /api/restraint/summaries・
# GET /api/restraint/{wage-source,synced-months} (D1 KINTAI_RESTRAINT_DB)。
# 本番へはタグ worker-kintai-v* の push で deploy する (.github/workflows/worker-kintai.yml)。
#
# ★ 外から届く口を持たない:
#   - fetch は Service Binding からだけ届く (route・workers.dev・preview なし)。
#   - 読みの口は認可なし (ユーザー決定 2026-10-10、一番星と同じ)。関門は呼び手 (relay の共有 secret、kyuyo-mcp の OAuth)
#   - 書き込みの口 (POST の 3 本 = CakePHP への autoload を含む・拘束サマリの PUT) だけ Worker が共有 secret KINTAI_WRITE_TOKEN を照合する (ユーザー決定 2026-10-10)
#   - workers_dev = false / preview_urls = false、route / routes を書かない、env を作らない
#   - MariaDB・CakePHP への口 (vpc_services)・Supabase への口 (hyperdrive)・拘束サマリの D1 (d1_databases)・auth-worker への RPC (services) はトップレベルにだけ置く。
#     ローカルで迂回する LOCAL_* の var は持たない
#   scripts/check-exposure.sh が CI で毎回これを検査する (陰性対照は scripts/check-exposure-test.sh)。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。
#
# MariaDB の資格情報は Secrets Store の secret (JSON。キー user/password/database。値は repo に書かない)
name = "ichibanboshi-kintai"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# Workers Logs (ログは段・失敗の種類・所要ミリ秒だけ)
[observability]
enabled = true

# CPU 時間の上限 (ms、上限は 300000)。既定の 30000 では足りない恐れがあるので上げる:
# kosoku-daily の全乗務員 (1 か月・view=full) はオンプレ版で約 11 秒 (DB の待ちを含む)、生行 約 6.4 万行を乗務員ごとに
# 畳んで約 2.2MB を書く。wasm はネイティブより遅いので、畳む部分が 2〜3 倍になっても収まるよう 120 秒にする
# (DB の待ちは CPU 時間に数えない)。合否は wrangler dev --remote で最大の月を測って決める
[limits]
cpu_ms = 120000

# 版の元 (workers/ichiban と同じ)
[version_metadata]
binding = "CF_VERSION_METADATA"

# MariaDB への口 (tcp 3306)。宛先の Tunnel・host:port は VPC Service 側に閉じる (コードの connect() の宛先は名目)。
# service_id は VPC Service `ichibanboshi-kintai-mariadb` の id (資格情報でも宛先でもない)。
[[vpc_services]]
binding = "KINTAI_MARIADB_VPC"
service_id = "01a12419-659c-7b21-ac68-945c6f23ccc8"
remote = true

# 社内 CakePHP (nginx) への口 (HTTP)。GET /api/kintai/{daily,pdf-json} と POST /api/dtako/autoload (③ resetby-unko-no を含む) が
# fetch する。宛先の host:port は VPC Service 側に閉じる (コードの URL の host は名目)。fetch は 3xx を追わない (redirect: manual)。
# service_id は VPC Service `ichibanboshi-kintai-cakephp` の id (資格情報でも宛先でもない)。無ければ 3 本は 503 (autoload の preview は configured: false)
[[vpc_services]]
binding = "KINTAI_CAKEPHP_VPC"
service_id = "01a12419-6924-7d63-9335-4693e124fc9e"
remote = true

# MariaDB の資格情報。store_id は Secrets Store の id、secret_name は secret 名 (どちらも値そのものではない)。
# 未投入なら /probe は 503
[[secrets_store_secrets]]
binding = "KINTAI_MARIADB"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "KINTAI_MARIADB"

# 書き込みの口 (POST /api/kintai/timecard・POST /api/kintai/wage-snapshot) の共有 secret。リクエストのヘッダー
# X-Kintai-Write-Token をこの値と定数時間で照合し、無い・違うなら 403、binding が無い・読めないなら 503。読みの口は照合しない。
# store は KINTAI_MARIADB と同じ (値は GCP の Secret Manager を正本に同期。repo に書かない)
[[secrets_store_secrets]]
binding = "KINTAI_WRITE_TOKEN"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "KINTAI_WRITE_TOKEN"

# Supabase (勤怠スキーマ kintai.*) への口。id は Hyperdrive の設定の id (接続先と資格情報は設定の側に在り、repo には書かない)。
# 分割 worker と共有の実行用ロールの設定。binding が無ければ Supabase の口 (読み 6 本・書き 2 本) は 503
[[hyperdrive]]
binding = "KINTAI_HYPERDRIVE"
id = "0110becff61044bb8435c457a69c63a1"

# 拘束サマリ (restraint) の写しの D1 (PUT /api/restraint/summaries・GET /api/restraint/{wage-source,synced-months})。
# オンプレ版の SQLite (restraint_local.sqlite) から移した。中身は relay が push する写しで、消えても relay の resummarize (全月) で
# 作り直せる。表の定義は migrations/0001_restraint.sql (共有 crate kintai-logic が include_str! で読む正本)。
# 本番 D1 への migration は人が 1 回だけ手で当てる (wrangler d1 migrations apply --remote)。CI の deploy は当てず、未適用が
# 0 件であることだけを確かめる (org の token に D1:Edit が無くてもタグ deploy が止まらないように)。トップレベルにだけ置く。
# binding が無ければ restraint の 3 口は 503
[[d1_databases]]
binding = "KINTAI_RESTRAINT_DB"
database_name = "ichibanboshi-kintai-restraint"
database_id = "9a70d878-604e-402f-a06a-b07696d99f9f"
migrations_dir = "migrations"

# auth-worker の勤怠 Worker 専用の named entrypoint KintaiAlcEntrypoint (RPC dtakoEtags(search))。GET /api/kintai/unko-gaps が
# alc の GET /api/dtako/events/etags を読むためだけに使う。path・method・tenant は auth-worker 側で固定 (渡すのは期間の query だけ)。
# 汎用の転送口 InternalEntrypoint (path の allowlist だけ・tenant は呼び手任せ) は使わない。無ければ unko-gaps は 503。トップレベルにだけ置く
[[services]]
binding = "KINTAI_ALC_RPC"
service = "auth-worker"
entrypoint = "KintaiAlcEntrypoint"

# 読み先のテナント (UUID の文字列)。GET /api/kintai/* はこの pin だけでテナントを決め、X-Tenant-ID は読まない。
# 空・UUID でない・nil UUID なら 503。
# 本番は deploy 時に repo variable `KINTAI_EVENTS_TENANT_ID` を `--var` で渡す (git 履歴に UUID を焼かない)。ここは空のまま
#
# GET /api/kintai/day-events のリンクの base URL (社内 nginx・dtako-admin)。空 = その項目のリンクを省く (オンプレ版の設定と同じ意味)。
# 本番は deploy 時に repo variable `KINTAI_RYOHI_BASE_URL`・`KINTAI_DTAKO_BASE_URL` を `--var` で渡す (社内ホスト名を repo に書かない)。ここは空のまま
[vars]
KINTAI_TENANT_ID = ""
KINTAI_RYOHI_BASE_URL = ""
KINTAI_DTAKO_BASE_URL = ""
