# 勤怠 Worker (Refs ohishi-exp/rust-ichibanboshi#322)。Service Binding からだけ届く。
# 口は到達の確認用の POST /probe と、Supabase を読む GET /api/kintai/* の 6 本・書く POST の 2 本 (共有 secret の照合あり)、
# 社内 MariaDB を直接読む GET の 10 本 (/api/kintai/* の 9 本と /api/dtako/worktime)。
# Workers VPC (binding KINTAI_MARIADB_VPC) 経由で社内 MariaDB に平文の MySQL プロトコルで繋ぐ (1 リクエスト 1 接続)。
# プロトコルの読み書きは kintai-mysql (I/O 無し)、ここは socket の読み書きと応答だけ。
# Supabase へは Hyperdrive (binding KINTAI_HYPERDRIVE) + alc-worker-db。SQL・入力検査・応答は kintai-logic。
[package]
name = "kintai-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# ippoan/alc-worker-kit (rev は workspace の 1 か所)。PgClient::tenant_tx と query_typed だけを出す
alc-worker-db = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kintai-logic = { path = "../logic" }
kintai-mysql = { path = "../mysql" }
# Supabase への書き込み (tenant_tx の中の query_typed / execute_typed。native の比較テストと同じもの)
kintai-pg = { path = "../pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# worker::Socket は tokio の AsyncRead/Write を持つ (kintai-mysql は I/O を持たないので compat は要らない)
tokio = { version = "1", default-features = false, features = ["io-util"] }
# Row と Error の型だけ (接続は alc-worker-db)。jsonb・timestamptz・uuid を読む feature (kit と同じ 0.7 に解決する)
tokio-postgres = { version = "0.7", default-features = false, features = ["js", "with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = "1"
wasm-bindgen = "0.2"
worker = "=0.8.7"
worker-sys = "=0.8.7"

[build-dependencies]
# build.rs の KINTAI_WORKER_OUTPUT_SHA (応答を形づくるコードの版。畳み方は ../output_sha.rs で repo ルートの build.rs と共有)
sha2 = "0.10"
