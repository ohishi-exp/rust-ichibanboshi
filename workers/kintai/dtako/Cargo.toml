# day-events と dtako/worktime の純粋部分 (Refs ohishi-exp/rust-ichibanboshi#322)。
# repo ルートの package (オンプレ版・Cloud Run 版) が path 依存で使い、勤怠 Worker も同じものを使う (写さない)。
# DB も I/O も持たない。依存は serde_json・chrono・kintai-kosoku だけで、wasm32 でも build できること。
# ここは repo ルートの build.rs の KINTAI_OUTPUT_SHA (勤怠の版) に入れない (元の src/routes/dtako_*.rs も glob の外)。
# kintai-kosoku に入れないのはそのため (入れると版が変わる)。kintai-logic に入れないのは postgres-types 等を root に持ち込まないため。
[package]
name = "kintai-dtako"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
# unko_no の先頭 12 桁の読み方と日時の書式 (glob の外から中を借りる向きなので版は動かない)
kintai-kosoku = { path = "../kosoku" }
serde_json = "1"
