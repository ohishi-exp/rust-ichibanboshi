# 勤怠 Worker が Supabase (勤怠スキーマ kintai.*) を読む 5 本の口の純粋部分 (Refs ohishi-exp/rust-ichibanboshi#322)。
# SQL 定数・Query の型と検査・引数の束 ($n と Type の対)・行の型・応答の組み立て・賃金スナップショットの集計。
# root の src/ (Cloud Run 版) からの写しで、DB も I/O も持たないので native で cargo test できる。
# 写しの対応表と「撤去までは片方を直したらもう片方も直す」は workers/kintai/README.md。
[package]
name = "kintai-logic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
# axum の Query と同じ読み方 (同じ拒否文言) にするため、axum 0.8 の Query と同じ 3 つで読む
form_urlencoded = "1"
# 社内 MariaDB の SQL 文と拘束・休息の純粋ロジック (オンプレ版と共有。写さない)
kintai-kosoku = { path = "../kosoku" }
# 名前付き引数の展開とテキストプロトコルの行の型
kintai-mysql = { path = "../mysql" }
# $n の Type と ToSql だけ (tokio-postgres の types は postgres-types の再 export。同じ版に解決される)
postgres-types = { version = "0.2", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
uuid = "1"

[dev-dependencies]
bytes = "1"
