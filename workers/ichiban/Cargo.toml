# 一番星 (CAPE#01) の Worker 化 (Refs ohishi-exp/rust-ichibanboshi#322)。logic は 6 本の純粋部分 (オンプレ版も path 依存で借りる)。
# repo ルートの package (オンプレ / Cloud Run の本体) とも workers/kyuyo とも独立した workspace。
[workspace]
members = ["logic", "worker"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
