# ichibanboshi-ichiban: 一番星 (CAPE#01) SQL Server の読み出し Worker (Refs ohishi-exp/rust-ichibanboshi#322)。
# Service Binding 専用。口は管理画面が使う GET 6 本 (/health・/api/employees・/api/vehicles・/api/sales/departments・
# /api/sales/vehicle-daily・/api/costs/vehicle-daily) と到達の切り分け用の POST /probe。
# 本番へはタグ worker-ichiban-v* の push で deploy する (.github/workflows/worker-ichiban.yml)。
#
# ★ 外から届く口を持たない:
#   - fetch は Service Binding からだけ届く (route・workers.dev・preview なし)。
#   - 認可なし (ユーザー決定 2026-10-09)。Service Binding 専用で、関門は呼び手 (管理画面の proxy) の requireAuth と
#     path allowlist。同じアカウントで Worker を deploy できる者は binding で読める (社員名・売上・経費) — 承知のうえ
#   - workers_dev = false / preview_urls = false、route / routes を書かない、env を作らない
#   - SQL Server への口 (vpc_services) はトップレベルにだけ置く
#   scripts/check-exposure.sh が CI で毎回これを検査する (陰性対照は scripts/check-exposure-test.sh)。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。
#
# SQL Server の資格情報は Secrets Store の secret (JSON。キー user/pass。値は repo に書かない)
name = "ichibanboshi-ichiban"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# Workers Logs (ログは stage・失敗の種類・所要ミリ秒だけ)
[observability]
enabled = true

# 版の元 (workers/kyuyo と同じ)
[version_metadata]
binding = "CF_VERSION_METADATA"

# SQL Server への口。宛先の Tunnel・host:port は VPC Service 側に閉じる (コードの connect() の宛先は名目)。
# service_id は VPC Service `ichibanboshi-ichiban-sql` (TCP) の id (資格情報でも宛先でもない)。
[[vpc_services]]
binding = "ICHIBAN_VPC"
service_id = "01a1205d-911c-7801-b60f-9dbc13dadaaf"
remote = true

# SQL Server の資格情報。store_id は Secrets Store の id、secret_name は投入済みの secret 名 (どちらも値そのものではない)
[[secrets_store_secrets]]
binding = "ICHIBAN_SQL"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "ICHIBAN_SQL"
