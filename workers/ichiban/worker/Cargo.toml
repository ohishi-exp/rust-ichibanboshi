# 一番星 Worker (Refs ohishi-exp/rust-ichibanboshi#322)。Service Binding からだけ届く。管理画面が使う GET 6 本
# (SQL・型・絞り込みの判定・組み立ては ichiban-logic) と到達の切り分け用の POST /probe。
# Workers VPC (binding ICHIBAN_VPC) 経由で一番星 SQL Server に TDS でログインする (1 リクエスト 1 接続)。
# tiberius の rustls feature と bb8-tiberius は wasm32 で落ちる (getrandom / mio / rustls-native-certs) ので入れない。
[package]
name = "ichiban-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# NaiveDateTime の列を読む (ichiban-logic と同じ chrono)
chrono = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ichiban-logic = { path = "../logic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# クエリ文字列の読み方はオンプレ版 (axum の Query) と同じ serde_urlencoded
serde_urlencoded = "0.7"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono"] }
# tiberius は futures の AsyncRead/Write を要求し、worker::Socket は tokio の AsyncRead/Write を持つので compat で繋ぐ
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
wasm-bindgen = "0.2"
worker = "=0.8.7"
worker-sys = "=0.8.7"
