# 給与大臣 Worker (Refs ohishi-exp/rust-ichibanboshi#322)。Service Binding からだけ届く fetch (POST /probe と /kyuyo/*) を
# DO KyuyoState (1 インスタンス) へ転送する。/kyuyo/* は転送の前に auth-worker の KyuyoAuthEntrypoint (AUTH_KYUYO) で認可する。
# SQL Server へは Workers VPC の binding KYUYO_VPC (VPC Service 型) から TCP で繋ぎ、tiberius で TDS を話す (中身は workers/shared の vpc-tds)。
# 経路・stage と応答の写像・資格情報の検証は ../logic (kyuyo-logic) に置く。
# tiberius の rustls feature と bb8-tiberius は wasm32 で落ちる (getrandom / mio / rustls-native-certs) ので入れない。
[package]
name = "kyuyo-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# synced_at (RFC3339) を作るだけ。tiberius の chrono feature と同じ crate
chrono = { version = "0.4", default-features = false, features = ["std"] }
js-sys = "0.3"
kyuyo-logic = { path = "../logic" }
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono"] }
# sync は DO の中で SQL Server を開く区間を直列化する Mutex
tokio = { version = "1", default-features = false, features = ["sync"] }
# Workers VPC の TCP・TDS のログイン (workers/ichiban と共有)
vpc-tds = { path = "../../shared/vpc-tds" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = "=0.8.7"
