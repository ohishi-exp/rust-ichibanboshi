# workers/kyuyo の 100% 行カバレッジ登録簿 (Refs #322)。
#
# 判定は repo ルートの scripts/check_coverage_100.sh を共用する (書式・規則は repo ルートの
# coverage_100.toml と同じ)。workers/kyuyo は別 workspace なので計測は worker-kyuyo.yml が取る:
#
#   cargo llvm-cov --manifest-path workers/kyuyo/Cargo.toml -p kyuyo-logic --text > cov.txt
#   bash scripts/check_coverage_100.sh --config workers/kyuyo/coverage_100.toml --use-cache cov.txt
#
# payroll.rs は旧 src/kyuyo/logic.rs (repo ルートの登録簿から移した)。email_allowed /
# normalize_emails は給与閲覧の認可の中核なので、この gate から外さないこと。

[[files]]
path = "workers/kyuyo/logic/src/lib.rs"

[[files]]
path = "workers/kyuyo/logic/src/payroll.rs"

# api.rs は応答型 (オンプレ版と共有)、store_keys.rs は derived store の鍵と DDL (オンプレ版と DO が共有)、
# auth.rs は /kyuyo/* の認可の読み方 (fail-closed の判定を含む)。
[[files]]
path = "workers/kyuyo/logic/src/api.rs"

[[files]]
path = "workers/kyuyo/logic/src/auth.rs"

[[files]]
path = "workers/kyuyo/logic/src/store_keys.rs"

# sql.rs は給与大臣に流す SQL 文と DB 名の検証 (オンプレ版の src/kyuyo/repo.rs と Worker が同じ文字列を流す)、
# service.rs は SQL Server を開く 5 口の純粋部分 (入力の検証・失敗の写像・行の組み立て・store の行の encode)。
[[files]]
path = "workers/kyuyo/logic/src/sql.rs"

[[files]]
path = "workers/kyuyo/logic/src/service.rs"
