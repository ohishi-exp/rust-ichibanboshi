# Workers VPC の binding から TCP を開き、tiberius で SQL Server にログインする (1 リクエスト 1 接続、Refs ohishi-exp/rust-ichibanboshi#322)。
# binding 名・database 名・secret 名は呼び手が `Target` で渡す。
# tiberius の rustls feature と bb8-tiberius は wasm32 で落ちる (getrandom / mio / rustls-native-certs) ので入れない。
[package]
name = "vpc-tds"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono"] }
# tiberius は futures の AsyncRead/Write を要求し、worker::Socket は tokio の AsyncRead/Write を持つので compat で繋ぐ
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
vpc-tds-logic = { path = "../vpc-tds-logic" }
wasm-bindgen = "0.2"
worker = "=0.8.7"
worker-sys = "=0.8.7"
