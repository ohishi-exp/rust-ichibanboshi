# vpc-tds の純粋部分: 失敗の stage と種類・資格情報 JSON の検証・host:port の分解 (Refs ohishi-exp/rust-ichibanboshi#322)。
# worker・tiberius・wasm-bindgen に依存しないので native で cargo test できる。
[package]
name = "vpc-tds-logic"
