# Workers VPC の TCP で SQL Server (TDS・vpc-tds) / MariaDB (MySQL・vpc-mysql) に繋ぐ部品 (Refs ohishi-exp/rust-ichibanboshi#322)。
# vpc-tds は workers/ichiban・workers/kyuyo、vpc-mysql は workers/kintai (と fuel Worker) が path / git 依存で使う。repo ルートとも各 Worker とも独立した workspace。
[workspace]
members = ["vpc-tds-logic", "vpc-tds", "vpc-mysql-logic", "vpc-mysql"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
