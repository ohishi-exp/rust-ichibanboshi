name: worker-ichiban

# workers/ichiban (一番星 SQL Server への到達確認 PoC Worker、Refs #322)。
#   - pull_request / main への push → logic の test と 100% gate、Worker の build・clippy・公開範囲の検査・wrangler deploy --dry-run
#     (この経路は secret も token も使わない)
# 本番へは出さない (deploy job なし。実接続の確認は wrangler dev --remote)。本実装の段で足す。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。
on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/ichiban/**'
      - '.github/workflows/worker-ichiban.yml'
  push:
    branches: [main]
    paths:
      - 'workers/ichiban/**'
      - '.github/workflows/worker-ichiban.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # README と揃える
  WRANGLER_VERSION: 4.144.0

jobs:
  worker:
    name: Logic test + Worker build + clippy + exposure + wrangler dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ichiban
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: ichiban-worker
          workspaces: workers/ichiban -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (ichiban-logic)
        working-directory: .
        run: cargo test --locked --manifest-path workers/ichiban/Cargo.toml -p ichiban-logic

      - uses: taiki-e/install-action@cargo-llvm-cov

      # 行カバレッジ 100% gate (登録簿 workers/ichiban/coverage_100.toml)。判定は repo ルートの
      # check_coverage_100.sh を共用する。filters の 400 判定は全件スキャン防止の関門
      - name: Coverage 100% gate (ichiban-logic)
        working-directory: .
        run: |
          cov="$RUNNER_TEMP/ichiban-logic-cov.txt"
          cargo llvm-cov --locked --manifest-path workers/ichiban/Cargo.toml -p ichiban-logic --text > "$cov"
          bash scripts/check_coverage_100.sh --config workers/ichiban/coverage_100.toml --use-cache "$cov"

      - name: Build (wasm32-unknown-unknown)
        run: cargo build --locked --target wasm32-unknown-unknown

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      # wrangler.toml の [build] command と同じ版
      - run: cargo install -q worker-build@0.8.7 --locked

      - name: worker-build --release
        working-directory: workers/ichiban/worker
        run: worker-build --release

      - name: Exposure check
        run: bash scripts/check-exposure.sh worker/wrangler.toml

      - name: Exposure check (negative control)
        run: bash scripts/check-exposure-test.sh worker/wrangler.toml

      # secret も token も要らない (build と設定の検証だけ)
      - name: wrangler deploy --dry-run
        working-directory: workers/ichiban/worker
        run: npx -y "wrangler@${WRANGLER_VERSION}" deploy --dry-run
