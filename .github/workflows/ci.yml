name: CI

# feature branch への push でも走らせる (Refs: spawn_task 子セッション運用)。
# 子セッションは「push までが仕事、PR は親が作る」ので、PR を作らないと CI が
# 1 つも走らない状態だと「PR 前に確認したい」を満たすためにローカルで全体
# テストを回すことになり、並行セッションが ~/.cargo/registry のロックと I/O を
# 取り合って詰まる。
#
# この repo の ci.yml は postgres service 込みなので branch push でも重いが、
# そのぶん価値がある — kintai_push_pg_test / kintai_fold_pg_test が
# KINTAI_TEST_DATABASE_URL 付きで **skip されずに走る唯一の場所**。
#
# **Cloud Run への deploy は gcp-image.yml (main push) が持っている。あちらの
# トリガは絶対に触らないこと。** この ci.yml 内の deploy (オンプレ CF Tunnel SSH)
# と kintai-migrate は if で main push 限定なので branch push では発火しない。
on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'perf/**', 'docs/**', 'chore/**', 'claude/**']
  pull_request:
    branches: [main]

# 連続 push のたびに古い run が走り続けて runner を食い潰すのを防ぐ。
# main と tag は途中でキャンセルするとデプロイ経路が切れるので絶対に止めない
# (`github.ref != 'refs/heads/main'` だけだと tag ref は refs/tags/* なので
# 式が true になってしまうため、tags/ を明示的に除外する)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + Coverage regression check
    runs-on: ubuntu-latest

    # kintai の push / fold は実 PostgreSQL 相手でしか意味のある検証にならない
    # (生成列・CHECK・upsert の衝突・RLS)。service container が無いと
    # tests/kintai_push_pg_test.rs と tests/kintai_fold_pg_test.rs は
    # KINTAI_TEST_DATABASE_URL 未設定で**丸ごと skip** され、緑のまま何も
    # 検証しない状態になる。migration job と同じ形の postgres を test job にも
    # 持たせて毎 PR 走らせる。
    # job ごとに別 runner (別 VM) なので、migration job も 5432 を publish して
    # いるが衝突しない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kintai-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # 版は rust-toolchain.toml が持つ (rustfmt / clippy / llvm-tools-preview も
      # そちらで指定)。@stable のまま浮かせると、stable が上がるだけで fmt の
      # 整形結果が変わり KINTAI_OUTPUT_SHA が回転する
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy, llvm-tools-preview

      # native target (= test job) と musl target (= deploy job) は target/ が
      # 別物なので shared-key を分離する必要がある。同 key で奪い合うと restore→
      # save→restore の thrashing で実質 cache 無効化される (= prod 報告: deploy
      # の release build cache 効いてない、2026-06-30)。
      # save-if を main 限定にすることで PR の中途半端な target/ が main の cache
      # を上書きするのを防ぐ (= 非対称 save-if、rust-alc-api #426 確立 pattern)。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ichibanboshi-native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # fmt / clippy を CI に入れる。Makefile には元からターゲットがあったが
      # CI で走っていなかったため、main で `cargo fmt --check` が 7 ファイル落ち、
      # `make clippy` (-D warnings) が exit 2 で失敗する状態が放置されていた
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      # migrations/*.sql はテスト側が自分で流すので psql は要らない。
      # 与える接続文字列が superuser 相当なのも migration job と同じ理由 (DDL を
      # 当て、ロールを作り直すため)。変数名が DATABASE_URL でないのは、この repo の
      # DATABASE_* が売上の SQL Server の名前空間だから (src/config.rs、#208)。
      - name: Run tests
        run: cargo test --locked
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          KINTAI_TEST_DATABASE_URL: postgres://postgres:kintai-test@127.0.0.1:5432/postgres

      # ここも同じ接続文字列を渡す。llvm-cov はテストを**もう一度**走らせるので、
      # 渡さないと PG のテストだけ skip されて計測が「テストで通った範囲」と
      # 食い違う。gate 対象に kintai_*.rs は入っていないので判定は変わらないが、
      # artifact の数字が実態とずれるのは避ける
      - name: Coverage regression check
        run: bash scripts/check_coverage_100.sh
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          KINTAI_TEST_DATABASE_URL: postgres://postgres:kintai-test@127.0.0.1:5432/postgres

      - name: Upload coverage text (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-text
          path: /tmp/llvm-cov-cache/text-*.txt
          retention-days: 7
          if-no-files-found: ignore

  # kintai スキーマの migration を実 PostgreSQL に流し、RLS を assert する
  # (Refs #205 実装計画 03)。Rust build は不要 (適用も検証も psql) なので test job
  # とは独立に並走させ、critical path を伸ばさない。
  #
  # rust-alc-api では migration の検証は staging DB / prod の Cloud Run job 側に
  # 任せているが、こちらには Postgres を持つ deploy 経路がまだ無い (G7 未着手)。
  # 「本番に流して初めて分かる」状態を作らないため、service container で毎 PR
  # 検証する形にした。DDL の生成列や CHECK が immutable 要件を満たすかは実際に
  # 流すまで分からない (実際 `AT TIME ZONE` の生成列がここで確認できた)。
  migration:
    name: kintai migration + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # RLS は「superuser 以外で繋いで初めて検証になる」ので、verify スクリプトが
      # kintai_reader / kintai_writer に検証用パスワードを付けて繋ぎ直す。そのため
      # 与える接続文字列は superuser 相当である必要がある。
      # 変数名が DATABASE_URL でないのは、この repo の DATABASE_* が売上の
      # SQL Server の名前空間だから (src/config.rs、#208)。
      - name: Apply migrations + assert RLS
        env:
          KINTAI_DATABASE_URL: postgres://postgres:verify@127.0.0.1:5432/postgres
          # 003 が要求する psql 変数。使い捨て postgres なので固定値でよい
          # (本番の値は kintai-migrate job 側で secret から渡す)
          KINTAI_WRITER_PASSWORD: verify-only-not-a-real-password
        run: bash scripts/verify_kintai_rls.sh

  # main への merge (push) で musl binary を build → Cloudflare Tunnel SSH 経由で
  # ohishi-data に自動 deploy する (Refs #14)。GitHub Actions runner は Tailscale
  # 網に居ないので、deploy.sh の Tailscale 経路ではなく cloudflared access ssh を
  # ProxyCommand にした SSH で到達し、CF Access service token で認証する。
  # deploy ロジックは deploy.sh (手動 fallback) と scripts/deploy-remote.sh を共有。
  deploy:
    name: Deploy to ohishi-data (CF Tunnel SSH)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml と同じ版を明示する。@stable のままだと action は
      # stable に musl target を入れるが、cargo は repo の rust-toolchain.toml に
      # 従って 1.97.1 を使うため target が無く E0463 で落ちる (#212 の回帰)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-musl

      # musl release build 用の専用 cache (test job の native target とは別 key)。
      # deploy は main push 限定なので save-if 条件は実質的に常に true だが、
      # 一貫性のため明示。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ichibanboshi-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build musl release binary
        # --locked で Cargo.lock 整合性を強制 (reproducible)。
        # CC_x86_64_unknown_linux_musl は ring 等の C 依存を musl-gcc で cross-compile
        # するため (rust-flickr ci.yml と同 pattern)。
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Write deploy SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy over Cloudflare Tunnel SSH
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PROXY_COMMAND: "cloudflared access ssh --hostname %h"
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DEPLOY_SSH_HOST" ]; then
            echo "::error::vars.DEPLOY_SSH_HOST is not set — configure repo/org variable" >&2
            exit 1
          fi
          # ~ は env で展開されないので run step 内で $HOME を使って絶対 path 化する
          export DEPLOY_SSH_KEY_FILE="$HOME/.ssh/deploy_key"
          bash scripts/deploy-remote.sh

  # kintai スキーマ (#205 の 03) を実際の Supabase へ当てる。
  #
  # **test と migration の両方が通ってから**しか走らない。migration job は同じ
  # DDL を使い捨ての postgres に流して RLS を assert する検証なので、そこが赤い
  # まま本物に当たることはない。
  #
  # 台帳 (_sqlx_migrations) で冪等。migration が無い push でも走るが、その場合は
  # `skip` になるだけ — 逆に「当たっているはずのものが当たっていない」ずれを毎回
  # 検出できる。適用済みファイルが書き換わっていれば checksum 不一致で落ちる。
  #
  # 承認を挟みたいときは GitHub 側で environment `kintai-database` に required
  # reviewers を付ける (workflow は変えない)。
  kintai-migrate:
    name: Apply kintai schema (Supabase)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, migration]
    runs-on: ubuntu-latest
    environment: kintai-database
    concurrency:
      group: kintai-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # secret 名を DATABASE_URL にしないのは、この repo の DATABASE_* が売上の
      # SQL Server の名前空間だから (src/config.rs、#208)。
      - name: Apply
        env:
          KINTAI_DATABASE_URL: ${{ secrets.KINTAI_DATABASE_URL }}
          # 003 (kintai_writer の資格情報) が要求する。GCP Secret Manager が正で、
          # そこから GitHub org secret へ sync してある。空のまま流すと
          # migrate_kintai.sh が 003 の適用を拒否する (空パスワードが静かに入るのを
          # 防ぐため) ので、ここで欠落は loud に落ちる
          KINTAI_WRITER_PASSWORD: ${{ secrets.KINTAI_WRITER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KINTAI_DATABASE_URL}" ]; then
            echo "::error::secret KINTAI_DATABASE_URL が environment 'kintai-database' に未設定" >&2
            exit 1
          fi
          bash scripts/migrate_kintai.sh

      # 当てた後に台帳を必ず出す。成功したのに中身が期待と違う、を見逃さないため。
      - name: Show ledger
        if: always()
        env:
          KINTAI_DATABASE_URL: ${{ secrets.KINTAI_DATABASE_URL }}
        run: bash scripts/migrate_kintai.sh --status

  # CI green 後に squash auto-merge を queue する (org 標準の caller-composed
  # pattern、go-cloudrun-proxy / rust-flickr と同形)。ohishi-exp org に
  # CI_APP_ID / CI_APP_PRIVATE_KEY が投入されたため self-contained job から
  # reusable に復帰 (Refs ippoan/secrets-inventory-gcp#51 — App installation
  # token mode 経由で sync 投入)。deploy job は push (merge 後) のみ走るので
  # auto-merge (PR run) とは排他、needs は test のみで良い。
  auto-merge:
    if: github.event_name == 'pull_request'
    # migration job も gate に入れる。ここに足さないと「CI green」の意味が
    # migration の検証を含まなくなり、gate が広告する範囲が実際の検証範囲を
    # 静かに超える (#206 で 100% gate について同じ判断をした)。
    needs: [test, migration]
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    # deploy job は push (refs/heads/main) 限定 trigger なので PR run の auto-merge
    # とは排他で並走しない (= merge -> branch 削除で deploy が cancel される race は
    # 起きない)。auto-merge.yml の deploy gate 静的検査は DAG だけ見て trigger 排他を
    # 判別できず deploy を needs 未配線として loud fail するので、明示的に除外する。
    with:
      deploy_gate_ignore: 'deploy'
    # auto-merge.yml は GitHub App credential (CI_APP_ID / CI_APP_PRIVATE_KEY)
    # を必須とする。reusable が **別 org (ippoan)** にあるため `secrets: inherit`
    # は効かない (inherit は同一 org / enterprise 内の reusable にしか secret を
    # 渡さない)。ohishi-exp org secret を named secret として明示的に渡す。
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
