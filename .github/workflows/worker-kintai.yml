name: worker-kintai

# workers/kintai (勤怠の読み出し Worker・自作の MySQL コーデック・Supabase を読む口の純粋部分、Refs #322)。
#   - pull_request / main への push → kintai-mysql・kintai-logic・kintai-kosoku・kintai-dtako の test と 100% gate、Worker の build・clippy・
#     公開範囲の検査・wrangler deploy --dry-run。pg-parity job で、Supabase への書き込み部品 (kintai-pg) に固定の入力を与えて
#     応答と書いた後の表の中身が固定した期待値になることを確かめる (postgres service。ci.yml の kintai migration + RLS job と
#     同じ形。job id の pg-parity は、比較の相手 (root) を外す前の名前を残している)
#     (この経路は secret も token も使わない)
#     拘束サマリの D1 の migration を runner の中の local D1 に当てて確かめる (本番の D1 には触らない)。
#   - タグ worker-kintai-v*            → 本番へ deploy (wrangler.toml のトップレベル。env は持たない)。その前に本番の D1 に
#     未適用の migration が無いことを wrangler d1 migrations list --remote で確かめる (当てるのは人。CI は当てない)
# merge では本番に出ない (タグで deploy)。v*.*.* タグには当てない。
# 本番のテナントは repo variable KINTAI_EVENTS_TENANT_ID (Cloud Run 版と同じ) を deploy 時に --var で渡す。
# 既定のほかに X-Kintai-Tenant-Id で選べるテナントは repo variable KINTAI_EVENTS_TENANT_IDS (カンマ区切り。未設定 = 既定だけ)。
# day-events のリンクの base URL は repo variable KINTAI_RYOHI_BASE_URL・KINTAI_DTAKO_BASE_URL (オンプレの設定と同じ値) を同じく --var で渡す。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。wrangler の出力はファイルに取り、mask してから伏せて出す。
on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/kintai/**'
      - '.github/workflows/worker-kintai.yml'
      # pg-parity が実 DB に当てる Supabase の migration (tests/common/mod.rs が読む)
      - 'migrations/**'
  push:
    branches: [main]
    # タグの push には paths が効かない (タグは常に走る)
    tags: ['worker-kintai-v*']
    paths:
      - 'workers/kintai/**'
      - '.github/workflows/worker-kintai.yml'
      - 'migrations/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # README と揃える
  WRANGLER_VERSION: 4.144.0

jobs:
  worker:
    name: MySQL codec + logic test + Worker build + clippy + exposure + wrangler dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/kintai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: kintai-worker
          workspaces: workers/kintai -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test (kintai-mysql, kintai-logic, kintai-kosoku, kintai-dtako)
        working-directory: .
        run: cargo test --locked --manifest-path workers/kintai/Cargo.toml -p kintai-mysql -p kintai-logic -p kintai-kosoku -p kintai-dtako

      - uses: taiki-e/install-action@cargo-llvm-cov

      # 行カバレッジ 100% gate (登録簿 workers/kintai/coverage_100.toml)。判定は repo ルートの
      # check_coverage_100.sh を共用する。コーデックは社内 DB の応答を読む唯一の場所、logic は 5 本の口の
      # 入力検査・SQL の引数・応答の形を持つ場所、kosoku は拘束・休息の計算そのもの、dtako は day-events と worktime の
      # 畳み方なので全行を通す
      - name: Coverage 100% gate (kintai-mysql, kintai-logic, kintai-kosoku, kintai-dtako)
        working-directory: .
        run: |
          cov="$RUNNER_TEMP/kintai-cov.txt"
          cargo llvm-cov --locked --manifest-path workers/kintai/Cargo.toml -p kintai-mysql -p kintai-logic -p kintai-kosoku -p kintai-dtako --text > "$cov"
          bash scripts/check_coverage_100.sh --config workers/kintai/coverage_100.toml --use-cache "$cov"

      - name: Build (wasm32-unknown-unknown)
        run: cargo build --locked --target wasm32-unknown-unknown

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      # wrangler.toml の [build] command と同じ版
      - run: cargo install -q worker-build@0.8.7 --locked

      - name: worker-build --release
        working-directory: workers/kintai/worker
        run: worker-build --release

      - name: Exposure check
        run: bash scripts/check-exposure.sh worker/wrangler.toml

      - name: Exposure check (negative control)
        run: bash scripts/check-exposure-test.sh worker/wrangler.toml

      # secret も token も要らない (build と設定の検証だけ)
      - name: wrangler deploy --dry-run
        working-directory: workers/kintai/worker
        run: npx -y "wrangler@${WRANGLER_VERSION}" deploy --dry-run

      # 拘束サマリの D1 の migration (worker/migrations、表の定義の正本) が D1 の SQLite で当たること。
      # 当てる先は runner の中の local D1 だけ (token も本番の D1 も使わない)。当てた後に未適用が 0 件になること
      - name: D1 migration (local) applies
        working-directory: workers/kintai/worker
        run: |
          npx -y "wrangler@${WRANGLER_VERSION}" d1 migrations apply KINTAI_RESTRAINT_DB --local
          out="$(npx -y "wrangler@${WRANGLER_VERSION}" d1 migrations list KINTAI_RESTRAINT_DB --local 2>&1)"
          echo "$out"
          if ! grep -q 'No migrations to apply' <<<"$out"; then
            echo "::error::local D1 に migration を当てた後も未適用が残っている"
            exit 1
          fi

  # Supabase への書き込み: Worker の部品 (kintai-pg、tokio-postgres の query_typed / execute_typed) に固定の入力を与え、
  # kintai.kintai_events・event_changes・wage_snapshot の中身と応答が固定した期待値になること
  # (tests/root_parity.rs。KINTAI_TEST_DATABASE_URL が無ければ失敗する)。fold の書き込み・読みは往復と件数・固定値
  # (tests/fold_store_parity.rs・window_parity.rs・fold_events_parity.rs)。入力の検査の status・本文 (tests/axum_parity.rs) と
  # 拘束サマリの D1 の SQL (tests/restraint_d1_parity.rs) は DB 不要。postgres service が要るので worker job とは別 job
  pg-parity:
    name: kintai-pg (Worker の書き込み) on postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kintai-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: kintai-pg-parity
          workspaces: workers/kintai -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (kintai-pg、native・テスト込み)
        run: cargo clippy --locked --manifest-path workers/kintai/Cargo.toml -p kintai-pg --all-targets -- -D warnings

      - name: Test (kintai-pg)
        env:
          KINTAI_TEST_DATABASE_URL: postgres://postgres:kintai-test@127.0.0.1:5432/postgres
        run: cargo test --locked --manifest-path workers/kintai/Cargo.toml -p kintai-pg

  deploy:
    name: deploy production
    needs: [worker, pg-parity]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/worker-kintai-v')
    runs-on: ubuntu-latest
    concurrency:
      group: kintai-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/kintai/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          # build の job とデプロイの job で同じキャッシュを使う (既定のキーは job 名を含み、デプロイから引けない)
          # 保存は worker の job に任せ、ここは復元だけ
          shared-key: kintai-worker
          workspaces: workers/kintai -> target
          save-if: false

      - run: cargo install -q worker-build@0.8.7 --locked

      # 拘束サマリの D1 (KINTAI_RESTRAINT_DB) の migration は CI では当てない (本番への適用は人が 1 回だけ手で打つ。
      # org の token に D1:Edit が無いとタグ deploy が全部止まるため)。ここでは未適用が 0 件であることだけを確かめ、
      # 1 件でも残っていれば deploy しない (表の無い D1 に新しいコードを出さない)。出力は deploy と同じく伏せてから出す
      - name: D1 migrations are all applied (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          log="$RUNNER_TEMP/d1-migrations.log"
          status=0
          npx -y "wrangler@${WRANGLER_VERSION}" d1 migrations list KINTAI_RESTRAINT_DB --remote >"$log" 2>&1 || status=$?
          grep -oE '[0-9A-Fa-f]{32}' "$log" | sort -u | while read -r hex; do
            echo "::add-mask::${hex}"
          done
          sed -E -e 's#[0-9A-Fa-f]{32}#<account>#g' "$log"
          if [ "$status" != 0 ]; then
            echo "::error::wrangler d1 migrations list --remote が失敗した (token に D1 の読み取り権限があるか確かめる)"
            exit "$status"
          fi
          if ! grep -q 'No migrations to apply' "$log"; then
            echo "::error::本番の D1 (KINTAI_RESTRAINT_DB) に未適用の migration がある。先に人が wrangler d1 migrations apply KINTAI_RESTRAINT_DB --remote を打つ"
            exit 1
          fi

      # wrangler の出力は $RUNNER_TEMP/deploy.log に取り、伏せてから出す (ログファイルそのものは出さない)。
      #   - 32 桁の hex (account ID): ::add-mask:: + <account> に置換
      # token は org の secret CLOUDFLARE_API_TOKEN (repo 単位の secret は作らない)
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KINTAI_TENANT_ID: ${{ vars.KINTAI_EVENTS_TENANT_ID }}
          KINTAI_TENANT_IDS: ${{ vars.KINTAI_EVENTS_TENANT_IDS }}
          KINTAI_RYOHI_BASE_URL: ${{ vars.KINTAI_RYOHI_BASE_URL }}
          KINTAI_DTAKO_BASE_URL: ${{ vars.KINTAI_DTAKO_BASE_URL }}
        run: |
          # 読み先のテナントは小文字 hex の UUID (nil 以外) だけを通す。値は出さない。
          # 空のまま deploy すると本番の GET /api/kintai/* が 503 になるので、ここで止める
          uuid_re='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          if ! [[ "${KINTAI_TENANT_ID}" =~ $uuid_re ]] || [ "${KINTAI_TENANT_ID}" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::error::repo variable KINTAI_EVENTS_TENANT_ID が空か UUID でない"
            exit 1
          fi
          echo "::add-mask::${KINTAI_TENANT_ID}"
          # 既定のほかに選べるテナント (カンマ区切り)。未設定・空なら --var を付けない ([vars] の空 = 既定だけ)。
          # 1 つずつ同じ形 (小文字 hex の UUID、nil 以外) だけを通す。値は出さない
          tenant_ids_var=()
          if [ -n "${KINTAI_TENANT_IDS}" ]; then
            IFS=',' read -ra ids <<<"${KINTAI_TENANT_IDS}"
            for id in "${ids[@]}"; do
              if ! [[ "${id}" =~ $uuid_re ]] || [ "${id}" = "00000000-0000-0000-0000-000000000000" ]; then
                echo "::error::repo variable KINTAI_EVENTS_TENANT_IDS に UUID でない要素がある (カンマ区切り・空白なし)"
                exit 1
              fi
              echo "::add-mask::${id}"
            done
            tenant_ids_var=(--var "KINTAI_TENANT_IDS:${KINTAI_TENANT_IDS}")
          fi
          # day-events のリンクの base URL は http:// か https:// で始まるものだけを通す。値は出さない (社内ホスト名)。
          # 本番ではリンクを必ず出す前提なので、空の repo variable でもここで止める ([vars] の空文字は dev 用)
          for name in KINTAI_RYOHI_BASE_URL KINTAI_DTAKO_BASE_URL; do
            if ! [[ "${!name}" =~ ^https?:// ]]; then
              echo "::error::repo variable ${name} が空か http(s):// で始まらない"
              exit 1
            fi
            echo "::add-mask::${!name}"
          done
          log="$RUNNER_TEMP/deploy.log"
          status=0
          npx -y "wrangler@${WRANGLER_VERSION}" deploy \
            --var "KINTAI_TENANT_ID:${KINTAI_TENANT_ID}" \
            "${tenant_ids_var[@]}" \
            --var "KINTAI_RYOHI_BASE_URL:${KINTAI_RYOHI_BASE_URL}" \
            --var "KINTAI_DTAKO_BASE_URL:${KINTAI_DTAKO_BASE_URL}" \
            --tag "$GITHUB_REF_NAME" --message "$GITHUB_SHA" >"$log" 2>&1 || status=$?
          # 何かを出す前に mask を登録する
          grep -oE '[0-9A-Fa-f]{32}' "$log" | sort -u | while read -r hex; do
            echo "::add-mask::${hex}"
          done
          sed -E -e 's#[A-Za-z0-9.-]+\.workers\.dev#<workers-dev>#g' -e 's#[0-9A-Fa-f]{32}#<account>#g' "$log"
          [ "$status" = 0 ] || exit "$status"
          # workers_dev = false なので workers.dev の URL は出ないはず (出たら公開されている)
          if grep -qE '[A-Za-z0-9.-]+\.workers\.dev' "$log"; then
            echo "::error::本番に workers.dev の URL が付いた (workers_dev = false のはず。直ちに止めること)"
            exit 1
          fi
