name: GCP image

# main の image を build して GHCR に push し、**Cloud Run へ deploy する**。
#
# ── オンプレと GCP の 2 経路が両方とも本番 ─────────────────────────────────
# rust-ichibanboshi はオンプレ (ohishi-data / systemd) と GCP (Cloud Run) の
# **両方を一級の実行形態として恒久的に持つ**方針。反映経路も 2 本ある:
#
#   ci.yml の deploy job (CF Tunnel SSH)      → ohishi-data。MariaDB / SQL Server を読む側
#   この workflow の deploy-cloud-run job     → Cloud Run。Supabase へ打刻を書く側
#
# **どちらか一方だけ deploy すると静かに割れる。** 実際に踏んだ (2026-07-31):
# 打刻の運び方を #225〜#229 で作り替えたが CI は オンプレにしか deploy しておらず、
# Cloud Run は #221 の image (`4e9944a`) のまま 8 コミット遅れていた。新しい受け口
# `POST /api/kintai/timecard/window` が無いので本番が 404 で止まった。
# **CI が両方を deploy するのが正しい** — 手で `gcloud run services update` を
# 打つ運用に戻さないこと。
#
# ── かつて deploy しなかった理由と、それが解けた経緯 ───────────────────────
# (a) 到達性: 本体は tiberius でオンプレの SQL Server を読む。GCP からそこへは
#     到達できない。**解けていないが問題ではなくなった** — 読み先が要らない役割
#     (打刻の受け口 = Supabase へ書く) を GCP 側が持つようになり、SQL Server 依存
#     ルートは `DATABASE_ENABLED=false` で 503 fail-closed になる (#208)
# (b) 起動不能 [解決] 宣言したバックエンドに繋がらなければ落ちる形にした (#208)
# (c) 設定注入 [解決] TOML と環境変数が対等な入力経路になった (#208)
# (d) ローカル状態 [解決] `SQLITE_PATH=""` = 置き場を持たない宣言 (#223)。
#     Cloud Run の揮発 FS に依存しない
#
# (b)(c) は smoke-both-forms job が毎回検証している (#205 の G9) — 同じイメージが
# GCP の形なら起動し、オンプレの形なら SQL Server が居ないので起動を拒否する。
#
# ── イメージの置き場所 (rust-alc-api の流儀に合わせる) ──────────────────────
# GHCR に push し、Cloud Run は Artifact Registry の **remote repository**
# (pull-through cache、asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr) 経由で
# pull する。AR に直接 push しないのは、そのために standard repository と push 権限
# を切る必要があり alc と別流儀になるため。`ghcr.io/` が二重に見えるのは正しい。
#
# ── 切り戻し ────────────────────────────────────────────────────────────────
# reusable は latest revision に 100% traffic を向ける。戻すときは revision 指定:
#   gcloud run services update-traffic rust-ichibanboshi \
#     --project cloudsql-sv --region asia-northeast1 --to-revisions <revision>=100

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  # 同一 ref の連続 push で無駄に並走させない。ただし cancel はしない —
  # 途中で殺すと「sha に対応する image が無い」状態が残るため。
  group: gcp-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # musl static binary → コンテナイメージ → GHCR
  # ---------------------------------------------------------------------------
  build-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml と同じ版を明示する。@stable のままだと action は
      # stable に musl target を入れるが、cargo は repo の rust-toolchain.toml に
      # 従って 1.97.1 を使うため target が無く E0463 で落ちる (#212 の回帰)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: x86_64-unknown-linux-musl

      # ci.yml の deploy job が作る musl cache を **読むだけ** で使う。
      # save-if: false にしてあるのは、同じ shared-key へ両方が save すると
      # ci.yml の comment にある restore→save→restore の thrashing を再現して
      # しまい、本番反映経路 (deploy job) の build を遅くするため。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ichibanboshi-musl
          save-if: false

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # deploy job (ci.yml) と同一条件で build する。同じ commit から出る binary が
      # 「オンプレに置かれたもの」と「イメージに入ったもの」で違うと、後で
      # Cloud Run へ移したとき差分の切り分けができなくなる。
      - name: Build musl release binary
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CC_x86_64_unknown_linux_musl: musl-gcc

      # rust-alc-api の build-image job と同じ形 — build 済みバイナリと Dockerfile
      # だけの小さい context を組む (repo 全体を docker daemon に送らない)。
      - name: Prepare Docker context
        run: |
          set -euo pipefail
          mkdir -p ctx
          cp target/x86_64-unknown-linux-musl/release/ichibanboshi ctx/
          chmod u+w ctx/ichibanboshi
          cp Dockerfile ctx/Dockerfile
          ls -l ctx/

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          # sha tag が正。branch/tag 名の移動 tag は人間向けの別名でしかない。
          TAGS="${IMAGE}:${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/tags/*) TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}" ;;
            refs/heads/main) TAGS="${TAGS},${IMAGE}:main" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "::notice::image tags = ${TAGS}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ichibanboshi-image
          cache-to: type=gha,mode=max,scope=ichibanboshi-image

      # コンテナの smoke test は下の smoke-both-forms job が担当する
      # (#208 で設定層が env var 対応したので「動く smoke test」が書けるようになった)。

  # ---------------------------------------------------------------------------
  # 両形態の smoke test (ohishi-exp/rust-ichibanboshi#205 の G9)
  # ---------------------------------------------------------------------------
  # #208 で実機確認した「同じイメージが設定だけで 2 つの実行形態になる」挙動を
  # CI に固定する。判定内容は scripts/smoke_container.sh のヘッダに全部書いてある。
  #
  # ── build-image と別 job にした理由 ────────────────────────────────────────
  # 検証対象を **GHCR に push されたイメージそのもの** にするため。build-image の
  # 中で `load: true` したローカルイメージを叩くと「push された成果物は壊れている
  # が smoke は緑」が起こり得る。pull し直せば、あとで Cloud Run が引くものと
  # 同一の digest を検証したことになる。
  #
  # ── PR では走らないことの明示 ──────────────────────────────────────────────
  # この workflow は main push / tag / workflow_dispatch のみ (上の `on:` 参照)。
  # PR 時に musl release build + イメージ build を足すと全 PR が数分遅くなる一方、
  # ここで見ているのは **Dockerfile 層だけ** (ENV PORT / ENV BIND_ADDR / CMD /
  # base image で musl binary が exec できるか) で、変更頻度が極端に低い。
  # アプリ側の挙動 (env override の優先順位、/health の backends、SQL Server
  # 依存ルートの 503) は tests/config_env_test.rs / tests/health_backends_test.rs /
  # tests/endpoint_error_test.rs が ci.yml で PR ごとに見ている。
  # Dockerfile を触る PR は、merge 前に `make smoke-image` をローカルで回すこと。
  smoke-both-forms:
    name: Smoke test both run forms
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-image が push した sha tag を引き直す (ローカル build ではなく
      # 「publish された成果物」を検証する)。push 直後の一時的な registry エラーで
      # 赤くしないため数回だけ retry する — 恒久的に引けないなら 3 回目で落ちる。
      - name: Pull published image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "${IMAGE}:${GITHUB_SHA}"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to pull ${IMAGE}:${GITHUB_SHA} after 3 attempts" >&2
              exit 1
            fi
            echo "pull attempt ${attempt} failed — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          docker image inspect "${IMAGE}:${GITHUB_SHA}" \
            --format 'digest={{index .RepoDigests 0}}'

      - name: Verify GCP form starts and on-prem form refuses to start
        run: bash scripts/smoke_container.sh "${IMAGE}:${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # GCP 側からこの sha の image が pull できるかを **読み取りだけ** で確認する
  # ---------------------------------------------------------------------------
  # この job が検査しているのは、将来 Cloud Run へ移すときに最初に壊れる場所 —
  # 「AR の remote repository が GHCR の (private な) package を引けているか」。
  # 引けていなければ deploy 時に image pull で落ちるので、先に CI で見ておく。
  #
  # 人間が用意する必要があるもの (全部そろうまでこの job は skip される):
  #   - repo/org variable `GCP_PROJECT`            例: cloudsql-sv
  #   - repo/org variable `GCP_AR_REMOTE_PREFIX`   例: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr
  #     (rust-alc-api が使っている GHCR pull-through の remote repository。
  #      ichibanboshi 用に別 repository を切るなら、その path をここに入れる)
  #   - repo/org secret `GCP_SA_KEY` … rust-alc-api と同じ credentials_json 方式。
  #     この job に要るのは読み取りだけなので roles/artifactregistry.reader で足りる
  #     (alc の deploy 用 SA を流用せず、per-repo に read 専用を切るのが望ましい)
  #   - GHCR の package `ghcr.io/ohishi-exp/rust-ichibanboshi` を AR remote repository が
  #     引けること。private package のままなら AR 側に upstream credential
  #     (GitHub PAT: read:packages) の登録が要る
  verify-artifact-registry:
    name: Verify image is pullable from GCP
    needs: [build-image]
    if: ${{ vars.GCP_PROJECT != '' && vars.GCP_AR_REMOTE_PREFIX != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Preflight — credentials present
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "::error::secrets.GCP_SA_KEY is empty — vars.GCP_PROJECT is set so this job is expected to run. Configure the service account key (roles/artifactregistry.reader) or unset GCP_PROJECT/GCP_AR_REMOTE_PREFIX to skip this job." >&2
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 読み取り専用。この workflow は gcloud の書き込み系 (run deploy / secrets
      # create / iam / artifacts push) を一切実行しない。
      - name: Describe image through Artifact Registry
        env:
          AR_PREFIX: ${{ vars.GCP_AR_REMOTE_PREFIX }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          set -euo pipefail
          AR_IMAGE="${AR_PREFIX}/${IMAGE}:${GITHUB_SHA}"
          echo "resolving ${AR_IMAGE}"
          if ! gcloud artifacts docker images describe "${AR_IMAGE}" \
                 --project "${GCP_PROJECT}"; then
            echo "::error::${AR_IMAGE} is not resolvable from GCP. If the Artifact Registry remote repository is a GHCR pull-through, check that it has upstream credentials for the private package ${IMAGE}." >&2
            exit 1
          fi
          echo "::notice::${AR_IMAGE} is pullable from GCP"

  # ---------------------------------------------------------------------------
  # Cloud Run へ deploy する (main のみ)
  # ---------------------------------------------------------------------------
  # **smoke を通ったイメージだけを出す。** needs に smoke-both-forms を入れて
  # あるのは、GHCR に push された成果物そのものが起動することを確かめてから
  # traffic を向けるため。
  #
  # ── 認証は WIF。鍵は使わない ───────────────────────────────────────────────
  # `vars.GCP_WIF_PROVIDER` / `vars.GCP_WIF_SERVICE_ACCOUNT_STAGING` は ohishi-exp
  # の org variable で、同じ org の nuxt-dtako-admin が secret-verify で既に使って
  # いる。実体の `staging-deploy@cloudsql-sv` は `roles/run.admin` /
  # `roles/iam.serviceAccountUser` / `roles/artifactregistry.reader` /
  # `roles/secretmanager.secretAccessor` を持つので、**新しい SA も JSON key も
  # 要らない** (2026-07-31 に inventory で確認)。
  #
  # ── env は宣言的に全部書く ─────────────────────────────────────────────────
  # reusable の `set_env_vars` は **declarative replace** (ここに書いた env が
  # 全てになる) なので、1 つでも落とすと本番から消える。`SQLITE_PATH` は
  # **空文字が意味を持つ** (= 置き場を持たない宣言、#223) ので、値がカンマを
  # 含まないことに依存しない `^@^` 区切りで渡す。
  #
  # `update_secrets` は additive なので、ここに書いたものだけ張り替わる。
  # runtime SA は**あえて渡さない** — 渡さなければ現状 (既定の compute SA、
  # `kintai-push-database-url` の per-secret grant はそこに付いている) が保たれる。
  #
  # ── 未設定なら skip する。ただし黙らない ───────────────────────────────────
  # org variable が消えたときに「deploy したつもりで何も出ていない」を作らない
  # ため、skip したことを announce job が必ず 1 行残す。
  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: [build-image, smoke-both-forms]
    if: >-
      github.ref == 'refs/heads/main'
      && vars.GCP_WIF_PROVIDER != ''
      && vars.GCP_WIF_SERVICE_ACCOUNT_STAGING != ''
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ippoan/ci-workflows/.github/workflows/cloud-run-deploy.yml@main
    with:
      service: rust-ichibanboshi
      region: asia-northeast1
      project: cloudsql-sv
      ghcr_image: ghcr.io/ohishi-exp/rust-ichibanboshi
      # build-image が push した sha tag。フル 40 桁でしか push していない
      image_tag: ${{ github.sha }}
      ar_repo: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr/ghcr.io/ohishi-exp/rust-ichibanboshi
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
      set_env_vars: '^@^DATABASE_ENABLED=false@SQLITE_PATH=@KINTAI_PUSH_ENABLED=true'
      update_secrets: 'KINTAI_PUSH_DATABASE_URL=kintai-push-database-url:latest'

  # ---------------------------------------------------------------------------
  # deploy を skip したことを必ず 1 行残す
  # ---------------------------------------------------------------------------
  # 「緑だから出ている」と読み違えるのが一番危ない。org variable が欠けて
  # deploy-cloud-run が skip されたときだけ warning を出す。
  announce-cloud-run-skip:
    name: Announce Cloud Run deploy skip
    needs: [build-image]
    if: >-
      github.ref == 'refs/heads/main'
      && (vars.GCP_WIF_PROVIDER == '' || vars.GCP_WIF_SERVICE_ACCOUNT_STAGING == '')
    runs-on: ubuntu-latest
    steps:
      - name: Warn that the image was published but not deployed
        run: |
          echo "::warning::image は publish したが Cloud Run へ deploy していない (vars.GCP_WIF_PROVIDER / vars.GCP_WIF_SERVICE_ACCOUNT_STAGING が未設定)。Cloud Run は前の revision のまま。"
          echo "### Cloud Run deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "org variable \`GCP_WIF_PROVIDER\` / \`GCP_WIF_SERVICE_ACCOUNT_STAGING\` が未設定のため deploy していない。Cloud Run は前の revision のまま。" >> "$GITHUB_STEP_SUMMARY"
