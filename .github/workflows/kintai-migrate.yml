name: kintai migrate

# kintai スキーマ (#205 の実装計画 03) を実際の Supabase へ適用する。
#
# ci.yml の migration job は「使い捨ての postgres に流して RLS を assert する」
# 検証で、こちらは「本物に当てる」方。分けてあるのは走る条件がまったく違うため
# (検証は毎 PR / 適用は意図したときだけ)。
#
# ── 冪等性 ────────────────────────────────────────────────────────────────
# 適用済みかどうかは `_sqlx_migrations` 台帳で判定する (scripts/migrate_kintai.sh)。
# 同じ migration を 2 度当てても何も起きない。逆に**適用済みファイルを書き換えて
# いると checksum 照合で失敗する** ので、事故った状態のまま流れることはない。
#
# ── いつ走るか ────────────────────────────────────────────────────────────
# main に migration が入ったら自動で当てる。「merge したのに当て忘れて、読み書き
# する側だけ先に動いている」状態を作らないため。paths で絞ってあるので、
# migration に無関係な push では走らない。
#
# 安全側の担保は environment (`kintai-database`) に寄せてある。GitHub 側で
# required reviewers を付ければ、push 由来でも apply の手前で止まって承認待ちに
# なる。止めたいときは workflow をいじるのではなくそちらで縛ること。
#
# 手で確かめたいときは workflow_dispatch で status / dry-run を選ぶ。

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/migrate_kintai.sh'
      - '.github/workflows/kintai-migrate.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'status = 適用状況を見るだけ / dry-run = 計画だけ / apply = 実際に当てる'
        required: true
        type: choice
        options:
          - status
          - dry-run
          - apply
        default: status

permissions:
  contents: read

concurrency:
  # 同じ DB に 2 本同時に当てない
  group: kintai-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # push 由来は mode という概念が無いので apply 固定。dispatch のときだけ選べる。
    name: kintai migrate (${{ inputs.mode || 'apply' }})
    runs-on: ubuntu-latest
    # 承認を要求できるよう environment を噛ませる。GitHub 側で required reviewers
    # を付ければ、push 由来でもここで止まる。
    environment: kintai-database
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # secret 名は kintai-database-url (Secret Manager 側) に合わせる。
      # DATABASE_URL にしないのは、この repo の DATABASE_* が売上の SQL Server の
      # 名前空間だから (src/config.rs、#208)。
      - name: Run migration
        env:
          KINTAI_DATABASE_URL: ${{ secrets.KINTAI_DATABASE_URL }}
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          if [ -z "${KINTAI_DATABASE_URL}" ]; then
            echo "::error::secret KINTAI_DATABASE_URL が environment 'kintai-database' に設定されていません" >&2
            exit 1
          fi
          case "$MODE" in
            status)  bash scripts/migrate_kintai.sh --status ;;
            dry-run) bash scripts/migrate_kintai.sh --dry-run ;;
            apply)   bash scripts/migrate_kintai.sh ;;
            *) echo "::error::unknown mode: $MODE" >&2; exit 2 ;;
          esac

      # 当てた後に「何が入っているか」を必ず出す。apply が成功したのに台帳が
      # 期待と違う、を見逃さないため。
      - name: Show ledger
        if: always()
        env:
          KINTAI_DATABASE_URL: ${{ secrets.KINTAI_DATABASE_URL }}
        run: bash scripts/migrate_kintai.sh --status
