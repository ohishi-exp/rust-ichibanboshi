port = 3100
bind_addr = "127.0.0.1"
log_dir = ""

# SQL Server (CAPE#01) を**使うと宣言するか**。既定 true = オンプレ (ohishi-data) の形。
# 宣言したものに起動時に繋がらなければ**起動失敗**する (静かな degraded を作らない)。
# SQL Server を持たない実行形態 (Cloud Run 等) は enabled = false を宣言する。その場合
# pool を作らず SQL Server 依存ルートは 503 fail-closed、/health は
# backends.sqlserver = "disabled" を返す。環境変数 DATABASE_ENABLED でも指定できる。
[database]
enabled = true
host = "localhost"
instance = "softec"
database = "CAPE#01"
user = "pbi"
password = "test"
trust_server_certificate = true

[cors]
allowed_origins = ["https://ichibanboshi.mtamaramu.com"]

# 給与大臣 (OHKEN) 読み取り (Refs #82)。未設定なら /api/kyuyo/* は 503 (fail-closed)。
# host / password / introspect_secret の実値は repo に置かず、デプロイ先の
# ichibanboshi.toml でのみ設定する (secrets-inventory 参照)。
# [kyuyo]
# host = "<給与PC-HOST>"
# port = 14330
# user = "kyuyo_reader"
# password = "<kyuyo_reader パスワード>"
# auth_worker_origin = "<auth-worker origin (実稼働は auth-staging 側)>"
# introspect_secret = "<INTERNAL_SHARED_SECRET_KYUYO>"
# app_origin = "https://dtako.ippoan.org"
# allowed_emails = ["<許可する email>"]
# 給与 derived store (SQLite、Refs #106)。省略時 /opt/ichibanboshi/kyuyo_local.sqlite、
# 空文字で無効 (常に live 読み)。キャッシュ扱い — 消して再 sync で全量再構築できる
# sqlite_path = "/opt/ichibanboshi/kyuyo_local.sqlite"

# 拘束サマリ store (SQLite、Refs #106 Phase 3)。省略時 /opt/ichibanboshi/restraint_local.sqlite、
# 空文字で無効 (/api/restraint/* が 503)。relay の resummarize (全月) で再構築できる写し
# [restraint]
# sqlite_path = "/opt/ichibanboshi/restraint_local.sqlite"

# ローカル状態 (担当者別売上 summary + recalc_jobs + verify_jobs、Refs #205 の G4)。
# 省略時 /opt/ichibanboshi/state.db、**空文字で無効** (/api/uriage/* が 503)。
#
# 上の 3 つと違ってキャッシュではない — uriage_person_* は SQL Server (CAPE#01) から
# 作り直せるが、recalc_jobs は fingerprint と R2 同期状態の**唯一の記録**で、消えると
# 差分再計算の基準が失われる。
#
# **GCP (Cloud Run) は空にする。** 揮発 FS に空の state.db が生えると
# /api/uriage/* が「壊れている」ではなく「0 件」を返す。イメージに TOML は焼かない
# 方針なので env で宣言する: SQLITE_PATH=""  (空でも上書きされる)
# [sqlite]
# path = "/opt/ichibanboshi/state.db"

# 社内 MariaDB (勤怠の生イベント、Refs #116)。未設定なら /api/kintai/events は
# 503 (fail-closed — 空配列を返して「0 件」に見せない)。
# 接続先は同一ホストの docker `db` コンテナ (loopback 1 hop)。password / database の
# 実値は repo に置かず、デプロイ先の ichibanboshi.toml でのみ設定する。
# 必要な権限は 5 テーブル (time_card_dstate / time_card_dtako / time_card_dtako_state /
# dtako_events / dtako_cars) の SELECT のみ。
# [mariadb]
# host = "127.0.0.1"
# port = 3306
# user = "kintai_reader"
# password = "<kintai_reader パスワード>"
# database = "<CakePHP の DB 名>"

# 修正リンク (/api/kintai/day-events) 組み立て用の base URL 2 つ (Refs #205 の 57)。
# fetch はしない — 文字列を組むだけ。空/未設定ならその項目のリンクを応答から省く。
# [dtako_day_links]
# 社内 nginx (CakePHP)。`<base>/ryohi-rows/view/<unko_no>` が未ログインで開ける。
# ryohi_base_url = "<社内 nginx の LAN ホスト>"
# dtako-admin (nuxt SPA)。`daily-report-api/zip` リンクは参考値 (直接は開けない) で、
# `<base>/daily-report-edit` (検索画面) だけが実際に使える。
# dtako_base_url = "https://dtako.ippoan.org"

# 勤怠の生イベントをどこから読むか (Refs #205 実装計画 02)。
# 既定は "mariadb" = 上の [mariadb] を直読みするオンプレの形 (挙動は従来どおり)。
#
# "http" にすると rust-alc-api の GET /api/dtako/events から生 CSV 行を取り、
# 同じ形に写して返す (MariaDB に到達できない Cloud Run 用)。宣言したのに
# base_url / tenant_id が無ければ**起動を失敗させる** ([database] enabled と同じ流儀)。
#
# 上流に口が無い読み出し (始業/終業の打刻・運行の確定イベント・フェリー) は
# [mariadb] が設定されていればそちらへ委譲する。**MariaDB が無く [kintai_push] が
# 有効なら、打刻だけは kintai.kintai_events から読み返す** (Refs #205 の G6)。
# どちらも無い形態では打刻が読めず、拘束は休息イベント由来の勤務しか組めない。
# フェリーは MariaDB 専用のまま (突合はオンプレ専用、#205 の決定 8)。
#
# tenant_id は打刻の読み返しにも使う。読みはこの 1 つで固定され、書き先を決める
# X-Tenant-ID とは別経路で来る — **両者が一致しているのは暗黙の前提**。
#
# 認証 token は 2 経路のどちらか片方だけを指定する (両方指定は起動失敗):
#   auth_token         — 静的な Bearer (device JWT を注入する 07 の受け皿)
#   auth_token_command — 出力を token として使うコマンド。開発機から叩くときはこちら。
#                        シェルは経由せず空白で argv に分割して exec する
#                        (パイプ・リダイレクト・クォートは使えない)
#   auth_token_metadata — GCE / Cloud Run の metadata server から identity token を取る。
#                        **Cloud Run の中ではこれしか選べない** — イメージには
#                        ca-certificates しか入っておらず gcloud も curl も無い。
#                        audience は base_url をそのまま使う
#
# 環境変数でも同じ項目を指定できる (Cloud Run の主経路):
#   KINTAI_EVENTS_SOURCE / _BASE_URL / _TENANT_ID / _TIMEOUT_SECS
#   KINTAI_EVENTS_AUTH_TOKEN / _AUTH_TOKEN_COMMAND / _AUTH_TOKEN_METADATA / _AUTH_TOKEN_TTL_SECS
# [kintai_events]
# source = "http"
# base_url = "https://<rust-alc-api の Cloud Run URL>"
# tenant_id = "<一番星のテナント UUID>"
# timeout_secs = 120
# auth_token_command = "gcloud auth print-identity-token"   # 開発機から
# auth_token_metadata = true                                # Cloud Run の中から
# auth_token_ttl_secs = 900

# 畳んだ勤怠をどこへ書くか (Refs #205 実装計画 04〜06)。打刻の push と再計算の書き先。
# 既定は enabled = false = 無効。宣言しない限り CLI (push / recalc / sync) は何もせず
# 落ちる — 「設定を忘れたまま走って 0 件成功に見える」を作らない ([database] enabled と
# 同じ流儀)。宣言したのに接続先や tenant_id が無ければ**起動を失敗させる**。
#
# **畳んで書くのは GCP 側** (2026-07-30 の決定)。オンプレは MariaDB から打刻を読んで
# relay に返すだけで、書くのは Cloud Run 側。オンプレ直書き (#217 の形) も残してあるので、
# 両方の形態でこの宣言が生きる。ここで使うロールは kintai_writer。
#
# **この pool は打刻の読み返しにも使う** (Refs #205 の G6)。[kintai_events] source = "http"
# で MariaDB が無い形態 (= GCP) では、上流 (rust-alc-api) に打刻の口が無いぶんを
# kintai.kintai_events から読み返す。宣言していないと打刻が 1 件も読めず
# shifts_from_timecard が空になる — /health の backends.kintai_events で見分けられる
# ("http" = 打刻を読む先が無い / "http+pg" = 読み返しが挿さっている)。
#
# **接続は session mode の pooler (5432) を使う。** transaction mode (6543) は prepared
# statement の扱いが違い、sqlx の既定 (文を準備して使い回す) と噛み合わない —
# 6543 を含む URL は起動時に弾く。direct connection (db.<ref>.supabase.co) は IPv6 のみ
# なので、ここからは届かない。
#
# tenant_id は **rust-alc-api の alc_api.tenants.id をそのまま使う** (新規採番しない)。
# 上の [kintai_events] tenant_id と一致していないと**起動しない** — ずれると生イベントの
# 読みと畳んだ勤怠の書きが別テナントを指し、kintai.* の RLS (app.current_tenant_id) が
# 静かに全件遮断するか別テナントへ書く。大文字小文字の違いは同一とみなす。
#
# **tenant_id は省略できる。** 打刻の受け口 (POST /api/kintai/timecard) は
# X-Tenant-ID ヘッダで書き先を決める — relay が KV (dtako-relay-config の
# dtako_accounts) に持っている値がテナントの正で、alc へも同じヘッダで渡している。
# 設定に写すと同じ値を 2 か所で保つことになる。書いた場合は **pin** として働き、
# ヘッダと食い違えば受け口が 403 を返す。
# ただし CLI (push / recalc / sync) はヘッダを持たないので **必須**。
#
# 環境変数でも同じ項目を指定できる:
#   KINTAI_PUSH_ENABLED / _DATABASE_URL / _TENANT_ID
#   KINTAI_PUSH_CONNECT_TIMEOUT_SECS / _STATEMENT_TIMEOUT_SECS
#
# migration スクリプト (scripts/migrate_kintai.sh) が使う KINTAI_DATABASE_URL とは
# **別物**。あちらは DDL を当てる所有者権限で、こちらは行を読み書きするだけの
# kintai_writer。同じ値を使い回さない。
#
# database_url の実値は repo に置かず、デプロイ先の ichibanboshi.toml
# (または systemd の EnvironmentFile) でのみ設定する。
# [kintai_push]
# enabled = true
# database_url = "postgres://kintai_writer:<パスワード>@<pooler ホスト>:5432/postgres"
# tenant_id = "<一番星のテナント UUID ([kintai_events] と同じ値)>"   # 任意
# connect_timeout_secs = 30
# statement_timeout_secs = 300

# 打刻を GCP 側へ渡す経路は**設定を持たない** (Refs #205 の 04b)。
#
# オンプレは MariaDB から読んで返すだけで、**外へは出ない**。運ぶのは relay:
#
#   relay → オンプレ GET  /api/kintai/timecard/drivers   対象月の乗務員を 1 ページ
#   relay → GCP    GET  /api/kintai/timecard/signatures  その乗務員ぶんの署名
#   relay → オンプレ POST /api/kintai/timecard/diff       署名を渡し、差分を受け取る
#   relay → GCP    POST /api/kintai/timecard             差分を渡す
#
# なので送り先 URL も相手の資格情報もオンプレには置かない。Cloudflare Tunnel の
# 30 秒上限があるので drivers は max_drivers で区切られ、続きは応答の
# next_after_driver_cd で返る。relay は null になるまで呼び直す。
