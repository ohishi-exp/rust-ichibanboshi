port = 3100
bind_addr = "127.0.0.1"
log_dir = ""

[database]
host = "localhost"
instance = "softec"
database = "CAPE#01"
user = "pbi"
password = "test"
trust_server_certificate = true

[cors]
allowed_origins = ["https://ichibanboshi.mtamaramu.com"]

# 給与大臣 (OHKEN) 読み取り (Refs #82)。未設定なら /api/kyuyo/* は 503 (fail-closed)。
# host / password / introspect_secret の実値は repo に置かず、デプロイ先の
# ichibanboshi.toml でのみ設定する (secrets-inventory 参照)。
# [kyuyo]
# host = "<給与PC-HOST>"
# port = 14330
# user = "kyuyo_reader"
# password = "<kyuyo_reader パスワード>"
# auth_worker_origin = "<auth-worker origin (実稼働は auth-staging 側)>"
# introspect_secret = "<INTERNAL_SHARED_SECRET_KYUYO>"
# app_origin = "https://dtako.ippoan.org"
# allowed_emails = ["<許可する email>"]
# 給与 derived store (SQLite、Refs #106)。省略時 /opt/ichibanboshi/kyuyo_local.sqlite、
# 空文字で無効 (常に live 読み)。キャッシュ扱い — 消して再 sync で全量再構築できる
# sqlite_path = "/opt/ichibanboshi/kyuyo_local.sqlite"

# 拘束サマリ store (SQLite、Refs #106 Phase 3)。省略時 /opt/ichibanboshi/restraint_local.sqlite、
# 空文字で無効 (/api/restraint/* が 503)。relay の resummarize (全月) で再構築できる写し
# [restraint]
# sqlite_path = "/opt/ichibanboshi/restraint_local.sqlite"

# 社内 MariaDB (勤怠の生イベント、Refs #116)。未設定なら /api/kintai/events は
# 503 (fail-closed — 空配列を返して「0 件」に見せない)。
# 接続先は同一ホストの docker `db` コンテナ (loopback 1 hop)。password / database の
# 実値は repo に置かず、デプロイ先の ichibanboshi.toml でのみ設定する。
# 必要な権限は 5 テーブル (time_card_dstate / time_card_dtako / time_card_dtako_state /
# dtako_events / dtako_cars) の SELECT のみ。
# [mariadb]
# host = "127.0.0.1"
# port = 3306
# user = "kintai_reader"
# password = "<kintai_reader パスワード>"
# database = "<CakePHP の DB 名>"
