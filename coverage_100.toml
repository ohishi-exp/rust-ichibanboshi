# 100% カバレッジ達成済みファイルの登録簿
#
# ここに登録されたファイルは CI (ci.yml の test job) で 100% 行カバレッジを
# 維持しているか検証される。1 行でも落ちたら CI が fail する。
#
#   確認: make cov-check   (= bash scripts/check_coverage_100.sh)
#
# 実測は `cargo llvm-cov --text` 1 本。本 repo のテストは lib unit test も
# tests/ の統合テストも全て MockRepo / wiremock / 純粋関数で完結しており、
# SQL Server も環境変数も要らない (= DB 起動の要否で分ける軸が無い)。
#
# ## なぜ rust-alc-api にある `type` (unit / mock / combined) が無いのか
#
# 先例 (rust-alc-api) の `type` は「どの cargo 呼び出しだけで 100% に届くか」を
# 表す。あちらは複数 crate の workspace (`--lib` が root package しか見ない) で、
# かつ統合テストが生きた PostgreSQL を要求するため「DB 無しで回せる部分集合」に
# 名前を付ける必要があった。本 repo はどちらの前提も持たない — 単一 package で、
# 全テストが外部サービス不要。したがって `type` は全行同じ値にしかならず、
# 区分として意味を持たないので持ち込まない。
# (先例からのコピーで復活させないこと。分ける必要が生まれたら、まず「どの
#  cargo 呼び出しが増えたのか」を書いてから足す)
#
# ## 登録の規約
#
# - **実測して 100% のファイルだけを入れる。** 未達を入れると gate が常時赤になる
# - **計測データに現れないファイルを入れない。** 現れなかったら gate はスキップ
#   せず fail する (先例はここを WARN で握り潰しており、登録済みなのに一度も
#   検証されていないファイルが実在した)。
#   `src/lib.rs` / `src/routes/mod.rs` は re-export だけで
#   実行行が 0 なので登録できない。
# - 100% に到達したファイルは登録漏れさせない (登録漏れ = gate が守っていない)
#
# ## 落とし穴
#
# 対象ファイルで `tracing` マクロを複数行に折り返さないこと。フォーマット文字列が
# 独立行になると (手書きでも rustfmt の折り返しでも) その行が行カバレッジに乗らず
# 100% gate が落ちる。メッセージを短くして 1 行に収める。
# (rust-alc-api で PR #399 / #400 の 2 回発生した実績のある罠)

# --- 認証 / 設定 ---

